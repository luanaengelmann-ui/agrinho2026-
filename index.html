<!DOCTYPE html>

<head>

<title>Agrinho 2026</title>

<style>
body{

    background:linear-gradient(#b6f0b6,#ffffff);

}

header{
    background:#2e7d32;
    color:white;
    padding:20px;
}

}

}

.galeria{
    display:flex;
    justify-content:center;

    padding:30px;

.galeria a img{

.galeria a img:hover{
